name: IZFIN UI1 Home Refactor

on:
  push:
    branches:
      - refactor/ui1-home-dashboard
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izfin-ui1-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[ui1-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/ui1-home-dashboard

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Reset generated files to develop baseline
        shell: bash
        run: |
          git fetch origin develop --depth=1
          git checkout FETCH_HEAD -- app2.py tests/test_core_architecture.py

      - name: Apply clean UI1 home extraction
        run: python scripts/refactor_ui1_home_v2.py

      - name: Compile changed Python modules
        run: |
          python -m py_compile app2.py izfin_ui/home_dashboard.py tests/test_home_dashboard.py tests/test_core_architecture.py

      - name: Create CI-only Streamlit secrets
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Run focused UI1 tests
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q tests/test_home_dashboard.py tests/test_core_architecture.py tests/test_apptest_smoke.py

      - name: Run complete test suite
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q

      - name: Verify permanent change scope and diff size
        shell: bash
        run: |
          git status --short
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              app2.py|tests/test_core_architecture.py) ;;
              *) echo "Unexpected generated path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          app_changes="$(git diff --numstat -- app2.py | awk '{print $1+$2}')"
          echo "app2 changed lines: ${app_changes:-0}"
          test "${app_changes:-99999}" -lt 400

      - name: Commit tested shell wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app2.py tests/test_core_architecture.py
          git commit -m "Wire home dashboard view models cleanly [ui1-bot]"
          git push origin HEAD:refactor/ui1-home-dashboard
