name: Scanner P6 Refactor

on:
  push:
    branches:
      - refactor/scanner-p6

permissions:
  contents: write

concurrency:
  group: scanner-p6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-p6-bot]') }}
    name: Scanner P6 Refactor Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Apply and diagnose Scanner P6
        shell: bash
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: |
          set +e
          mkdir -p qa
          : > qa/scanner-p6-diagnostic.txt
          echo "Scanner P6 diagnostic" >> qa/scanner-p6-diagnostic.txt
          echo "commit=${GITHUB_SHA}" >> qa/scanner-p6-diagnostic.txt
          echo "python=$(python --version 2>&1)" >> qa/scanner-p6-diagnostic.txt
          echo >> qa/scanner-p6-diagnostic.txt

          echo "=== APPLY ===" >> qa/scanner-p6-diagnostic.txt
          python scripts/refactor_scanner_p6.py >> qa/scanner-p6-diagnostic.txt 2>&1
          APPLY_CODE=$?
          echo "APPLY_CODE=${APPLY_CODE}" >> qa/scanner-p6-diagnostic.txt
          echo >> qa/scanner-p6-diagnostic.txt

          echo "=== DIFF ===" >> qa/scanner-p6-diagnostic.txt
          git diff --name-only >> qa/scanner-p6-diagnostic.txt 2>&1
          DIFF_CODE=$?
          echo "DIFF_CODE=${DIFF_CODE}" >> qa/scanner-p6-diagnostic.txt
          echo >> qa/scanner-p6-diagnostic.txt

          VERIFY_CODE=0
          if [ "${APPLY_CODE}" -eq 0 ]; then
            mapfile -t changed < <(git diff --name-only | grep -v '^qa/scanner-p6-diagnostic.txt$')
            if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "app2.py" ]; then
              echo "VERIFY_SCOPE=FAIL changed=${changed[*]}" >> qa/scanner-p6-diagnostic.txt
              VERIFY_CODE=1
            else
              echo "VERIFY_SCOPE=PASS" >> qa/scanner-p6-diagnostic.txt
            fi
          else
            VERIFY_CODE=1
            echo "VERIFY_SCOPE=SKIP" >> qa/scanner-p6-diagnostic.txt
          fi
          echo "VERIFY_CODE=${VERIFY_CODE}" >> qa/scanner-p6-diagnostic.txt
          echo >> qa/scanner-p6-diagnostic.txt

          echo "=== COMPILE ===" >> qa/scanner-p6-diagnostic.txt
          if [ "${APPLY_CODE}" -eq 0 ] && [ "${VERIFY_CODE}" -eq 0 ]; then
            python -m py_compile app2.py izfin_services/ticker_analysis.py izfin_services/market_session.py izfin_services/scan_service.py izfin_core/scanner_engine.py izfin_core/scanner_pipeline.py >> qa/scanner-p6-diagnostic.txt 2>&1
            COMPILE_CODE=$?
          else
            COMPILE_CODE=1
            echo "compile skipped" >> qa/scanner-p6-diagnostic.txt
          fi
          echo "COMPILE_CODE=${COMPILE_CODE}" >> qa/scanner-p6-diagnostic.txt
          echo >> qa/scanner-p6-diagnostic.txt

          echo "=== TARGETED TESTS ===" >> qa/scanner-p6-diagnostic.txt
          if [ "${COMPILE_CODE}" -eq 0 ]; then
            python -m pytest -q tests/test_ticker_analysis.py tests/test_market_session.py tests/test_scan_service.py tests/test_scanner_pipeline.py tests/test_scanner_engine.py tests/test_scanner_engine_p2.py tests/test_core_architecture.py >> qa/scanner-p6-diagnostic.txt 2>&1
            TARGET_CODE=$?
          else
            TARGET_CODE=1
            echo "targeted tests skipped" >> qa/scanner-p6-diagnostic.txt
          fi
          echo "TARGET_CODE=${TARGET_CODE}" >> qa/scanner-p6-diagnostic.txt
          echo >> qa/scanner-p6-diagnostic.txt

          echo "=== FULL TEST SUITE ===" >> qa/scanner-p6-diagnostic.txt
          if [ "${TARGET_CODE}" -eq 0 ]; then
            python -m pytest -q >> qa/scanner-p6-diagnostic.txt 2>&1
            FULL_CODE=$?
          else
            FULL_CODE=1
            echo "full suite skipped" >> qa/scanner-p6-diagnostic.txt
          fi
          echo "FULL_CODE=${FULL_CODE}" >> qa/scanner-p6-diagnostic.txt
          echo >> qa/scanner-p6-diagnostic.txt

          if [ "${APPLY_CODE}" -eq 0 ] && [ "${VERIFY_CODE}" -eq 0 ] && [ "${COMPILE_CODE}" -eq 0 ] && [ "${TARGET_CODE}" -eq 0 ] && [ "${FULL_CODE}" -eq 0 ]; then
            echo "RESULT=PASS" >> qa/scanner-p6-diagnostic.txt
          else
            echo "RESULT=FAIL" >> qa/scanner-p6-diagnostic.txt
          fi

          cat qa/scanner-p6-diagnostic.txt
          exit 0

      - name: Commit diagnostic and tested refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/scanner-p6-diagnostic.txt
          if grep -q '^RESULT=PASS$' qa/scanner-p6-diagnostic.txt; then
            git add app2.py
          fi
          if git diff --cached --quiet; then
            echo "No diagnostic/refactor changes to commit."
            exit 0
          fi
          git commit -m "Scanner P6 diagnostic [scanner-p6-bot]"
          git push origin HEAD:refactor/scanner-p6
