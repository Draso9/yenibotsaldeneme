name: IZFIN Scan Selection Browser Acceptance

on:
  push:
    branches:
      - fix/scan-selection-continuity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izfin-scan-selection-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: Scan Selection Real Browser Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run scan selection browser acceptance
        env:
          IZFIN_SCAN_QA_BASE_URL: https://izfin-web-git-fix-scan-selection-continuity-adopcin-7216.vercel.app
          IZFIN_SCAN_QA_ARTIFACT_DIR: scan-selection-browser-artifacts
        run: python scripts/scan_selection_browser_acceptance.py

      - name: Upload browser acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-selection-browser-acceptance
          path: scan-selection-browser-artifacts
          if-no-files-found: warn
          retention-days: 7
