name: IZFIN CP6 Browser Acceptance

on:
  push:
    branches:
      - chore/checkpoint6-release-acceptance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izfin-cp6-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: CP6 Real Browser Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run remaining production browser acceptance
        env:
          IZFIN_CP6_BASE_URL: https://izfin-web.vercel.app
          IZFIN_CP6_ARTIFACT_DIR: cp6-browser-artifacts
        run: python scripts/cp6_browser_acceptance_v3.py

      - name: Upload browser acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-browser-acceptance
          path: cp6-browser-artifacts
          if-no-files-found: warn
          retention-days: 7
