name: IZFIN Scanner Pipeline Wire Once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/scanner-pipeline-wire-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Apply scanner pipeline patch
        run: python scripts/refactor_scanner_pipeline_once.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Create CI-only Streamlit secrets
        run: |
          mkdir -p "${HOME}/.streamlit"
          printf '%s\n' \
            'FINNHUB_API_KEY = ""' \
            'GOOGLE_OAUTH_CLIENT_ID = ""' \
            'GOOGLE_OAUTH_CLIENT_SECRET = ""' \
            'GOOGLE_OAUTH_REDIRECT_URI = ""' \
            'ADMIN_EMAILS = ""' \
            'SENTRY_DSN = ""' \
            'IZFIN_ENVIRONMENT = "ci"' \
            'IZFIN_DATA_CONTROLLER_NAME = ""' \
            'IZFIN_CONTACT_EMAIL = ""' \
            'IZFIN_DATA_CONTROLLER_ADDRESS = ""' \
            > "${HOME}/.streamlit/secrets.toml"

      - name: Run full test suite before commit
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q

      - name: Commit only after tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app2.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No app2.py changes detected."
            exit 0
          fi
          git commit -m "Wire scanner technical pipeline into app"
          git push origin develop
