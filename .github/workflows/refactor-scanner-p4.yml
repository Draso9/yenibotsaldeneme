name: Scanner P4 Refactor

on:
  push:
    branches:
      - refactor/scanner-p4

permissions:
  contents: write

concurrency:
  group: scanner-p4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-p4-bot]') }}
    name: Scanner P4 Refactor Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Apply scanner P4 wiring
        run: python scripts/refactor_scanner_p4.py

      - name: Verify refactor scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "app2.py" ]; then
            echo "Unexpected working-tree changes detected."
            exit 1
          fi

      - name: Compile refactored modules
        run: python -m py_compile app2.py izfin_services/scan_service.py izfin_core/scanner_engine.py izfin_core/scanner_pipeline.py

      - name: Run scanner P4 targeted tests
        run: python -m pytest -q tests/test_scan_service.py tests/test_scanner_pipeline.py tests/test_scanner_engine.py tests/test_scanner_engine_p2.py tests/test_core_architecture.py

      - name: Run complete test suite
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q

      - name: Commit tested app2 refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app2.py
          if git diff --cached --quiet; then
            echo "No app2.py changes to commit."
            exit 0
          fi
          git commit -m "Wire scanner data orchestration service into smart scan [scanner-p4-bot]"
          git push origin HEAD:refactor/scanner-p4
