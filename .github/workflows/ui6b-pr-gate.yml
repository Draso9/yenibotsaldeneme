name: UI6B PR Gate

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ui6b-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refactor/ui6b-market-overview'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout clean UI6B head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Compile UI6B paths
        run: |
          python -m py_compile \
            app2.py \
            izfin_services/market_overview.py \
            izfin_ui/market_bar.py \
            tests/test_market_overview.py \
            tests/test_market_bar.py \
            tests/test_core_architecture.py

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Run focused UI6B tests
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: ci
        run: |
          python -m pytest -q \
            tests/test_market_overview.py \
            tests/test_market_bar.py \
            tests/test_core_architecture.py \
            tests/test_static_integrity.py \
            tests/test_apptest_smoke.py

      - name: Run complete test suite
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: ci
        run: python -m pytest -q

      - name: Verify clean checkout
        shell: bash
        run: |
          test ! -e scripts/refactor_ui6b_market_overview.py
          test ! -e qa/ui6b_gate_trigger.txt
          git diff --exit-code
