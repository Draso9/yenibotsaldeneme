name: Scanner P2 Refactor

on:
  push:
    branches:
      - refactor/scanner-p2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-p2-bot]') }}
    name: Scanner P2 Refactor Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - id: install
        name: Install locked dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - id: secrets
        name: Create CI-only Streamlit secrets file
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - id: refactor
        name: Apply scanner P2 refactor
        continue-on-error: true
        run: python scripts/refactor_scanner_p2.py

      - id: boundary
        name: Validate scanner architecture boundaries
        continue-on-error: true
        run: python scripts/validate_scanner_boundaries.py

      - id: diff
        name: Verify only app2.py changed
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "app2.py" ]; then
            echo "Unexpected working-tree changes detected."
            exit 1
          fi

      - id: compile
        name: Compile refactored modules
        continue-on-error: true
        run: python -m py_compile app2.py izfin_core/scanner_engine.py

      - id: targeted
        name: Run scanner P2 tests
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: python -m pytest -q tests/test_scanner_engine.py tests/test_scanner_engine_p2.py

      - id: full
        name: Run complete test suite
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q

      - id: format
        name: Validate focused app2 diff size
        continue-on-error: true
        shell: bash
        run: |
          read -r added deleted path < <(git diff --numstat -- app2.py)
          echo "app2.py diff: +${added} -${deleted}"
          if [ "$path" != "app2.py" ]; then
            echo "app2.py diff could not be measured."
            exit 1
          fi
          if [ "$added" -gt 350 ] || [ "$deleted" -gt 350 ]; then
            echo "Refactor diff is unexpectedly large; refusing to commit."
            exit 1
          fi

      - name: Persist diagnostic and tested refactor
        if: always()
        shell: bash
        run: |
          cat > .scanner_p2_diagnostic.txt <<EOF
          install=${{ steps.install.outcome }}
          secrets=${{ steps.secrets.outcome }}
          refactor=${{ steps.refactor.outcome }}
          boundary=${{ steps.boundary.outcome }}
          diff=${{ steps.diff.outcome }}
          compile=${{ steps.compile.outcome }}
          targeted=${{ steps.targeted.outcome }}
          full=${{ steps.full.outcome }}
          scope=${{ steps.format.outcome }}
          EOF

          all_ok=true
          for value in \
            "${{ steps.install.outcome }}" \
            "${{ steps.secrets.outcome }}" \
            "${{ steps.refactor.outcome }}" \
            "${{ steps.boundary.outcome }}" \
            "${{ steps.diff.outcome }}" \
            "${{ steps.compile.outcome }}" \
            "${{ steps.targeted.outcome }}" \
            "${{ steps.full.outcome }}" \
            "${{ steps.format.outcome }}"; do
            if [ "$value" != "success" ]; then
              all_ok=false
            fi
          done
          echo "all_ok=${all_ok}" >> .scanner_p2_diagnostic.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$all_ok" = "true" ]; then
            git add app2.py .scanner_p2_diagnostic.txt
            git commit -m "Wire scanner engine into smart scan [scanner-p2-bot]"
          else
            git restore -- app2.py || true
            git add .scanner_p2_diagnostic.txt
            git commit -m "Record scanner P2 diagnostic [scanner-p2-bot]"
          fi
          git push origin HEAD:refactor/scanner-p2

      - name: Fail gate when a diagnostic step failed
        if: always()
        shell: bash
        run: grep -q '^all_ok=true$' .scanner_p2_diagnostic.txt
