name: UI5B PR Gate

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: ui5b-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refactor/ui5b-navigation-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout UI5B head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Run pure UI5B unit tests before shell wiring
        run: |
          python -m pytest -q \
            tests/test_bootstrap_service.py \
            tests/test_navigation.py \
            tests/test_ui5b_architecture_contract.py

      - name: Apply UI5B shell extraction when needed
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path("app2.py").read_text(encoding="utf-8")
          required = (
              "from izfin_services.bootstrap_service import (",
              "from izfin_ui.navigation import (",
              "session_defaults_hazirla(VARSAYILAN_TICKERS)",
              "kullanici_watchlist_bootstrap_hazirla(",
              "kullanici_watchlist_kaydet(",
              "navigation_paketi_hazirla(",
              "logout_state_paketi(VARSAYILAN_TICKERS)",
          )
          legacy = (
              "def _kullanici_liste_doc_id():",
              "_varsayilan_set = set(",
              "_izfin_nav_items = [",
          )
          if all(marker in source for marker in required) and all(marker not in source for marker in legacy):
              print("UI5B shell wiring already present; transform skipped.")
          else:
              subprocess.check_call([sys.executable, "scripts/refactor_ui5b_navigation_bootstrap.py"])
          PY

      - name: Compile UI5B paths
        run: |
          python -m py_compile \
            app2.py \
            izfin_services/bootstrap_service.py \
            izfin_ui/navigation.py \
            tests/test_bootstrap_service.py \
            tests/test_navigation.py \
            tests/test_ui5b_architecture_contract.py \
            tests/test_core_architecture.py

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Run focused UI5B integration tests
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: |
          python -m pytest -q \
            tests/test_bootstrap_service.py \
            tests/test_navigation.py \
            tests/test_ui5b_architecture_contract.py \
            tests/test_firestore_repositories.py \
            tests/test_core_architecture.py \
            tests/test_apptest_smoke.py

      - name: Run complete test suite
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q

      - name: Verify generated UI5B diff
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              app2.py|tests/test_core_architecture.py) ;;
              *) echo "Unexpected generated path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          app_changes="$(git diff --numstat -- app2.py | awk '{print $1+$2}')"
          echo "app2 changed lines: ${app_changes:-0}"
          test "${app_changes:-99999}" -lt 420

      - name: Commit tested UI5B shell wiring when generated
        shell: bash
        run: |
          if git diff --quiet -- app2.py tests/test_core_architecture.py; then
            echo "UI5B product wiring already committed; no bot commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app2.py tests/test_core_architecture.py
          git commit -m "Wire navigation and bootstrap services [ui5b-bot]"
          git push origin HEAD:refactor/ui5b-navigation-bootstrap
