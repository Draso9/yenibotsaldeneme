name: IZFIN CI

on:
  push:
    branches:
      - develop
      - refactor/scanner-p8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izfin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-p8-bot]') }}
    name: IZFIN Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Verify required runtime imports
        run: |
          python - <<'PY'
          import streamlit
          import pandas
          import numpy
          import yfinance
          import requests
          import firebase_admin
          import extra_streamlit_components
          import sentry_sdk
          print("IZFIN runtime imports: OK")
          PY

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Apply Scanner P8 cleanup
        run: python scripts/refactor_scanner_p8.py

      - name: Verify Scanner P8 scope and compile
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "app2.py" ]; then
            echo "Unexpected P8 scope: ${changed[*]}"
            exit 1
          fi
          python -m py_compile app2.py izfin_services/ticker_analysis.py izfin_services/market_session.py izfin_services/scan_service.py izfin_ui/scan_results.py

      - name: Run complete test suite
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q

      - name: Commit tested Scanner P8 cleanup
        if: ${{ github.ref == 'refs/heads/refactor/scanner-p8' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app2.py
          if git diff --cached --quiet; then
            echo "No P8 app changes to commit."
            exit 0
          fi
          git commit -m "Scanner P8 tested cleanup [scanner-p8-bot]"
          git push origin HEAD:refactor/scanner-p8
