name: IZFIN CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izfin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt bulunamadı; yalnız test bağımlılıkları kurulacak."
          fi

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Verify regression test files
        shell: bash
        run: |
          test -f tests/conftest.py
          test -f tests/test_bist_and_symbols.py
          test -f tests/test_decision_engine.py
          test -f tests/test_static_integrity.py
          test -f tests/test_ci_security.py
          test -f tests/test_quality_gate.py
          test -f tests/test_admin_qa.py
          echo "IZFIN regression test files: OK"

      - name: Run IZFIN regression suite
        run: |
          python -m pytest \
            tests/test_bist_and_symbols.py \
            tests/test_decision_engine.py \
            tests/test_static_integrity.py \
            tests/test_ci_security.py \
            tests/test_quality_gate.py \
            tests/test_admin_qa.py \
            -q

  streamlit-smoke:
    name: Streamlit AppTest Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: regression

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install production dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt bulunamadı."
          fi

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Verify required runtime imports
        run: |
          python - <<'PY'
          import streamlit
          import pandas
          import numpy
          import yfinance
          import requests
          import firebase_admin
          import extra_streamlit_components
          print("IZFIN runtime imports: OK")
          PY

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<'EOF'
          # CI smoke-test fixture only.
          # Real production secrets are intentionally NOT stored in GitHub.
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          EOF
          echo "CI Streamlit secrets fixture created."

      - name: Run Streamlit AppTest smoke tests
        env:
          # Empty CI values intentionally keep tests away from live Firebase/Finnhub writes.
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
        run: python -m pytest tests/test_apptest_smoke.py -q

  ci-summary:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - regression
      - streamlit-smoke

    steps:
      - name: Require all IZFIN checks to pass
        shell: bash
        run: |
          echo "Regression: ${{ needs.regression.result }}"
          echo "AppTest:    ${{ needs.streamlit-smoke.result }}"

          if [ "${{ needs.regression.result }}" != "success" ]; then
            echo "Regression testleri başarısız."
            exit 1
          fi

          if [ "${{ needs.streamlit-smoke.result }}" != "success" ]; then
            echo "Streamlit AppTest başarısız."
            exit 1
          fi

          echo "IZFIN CI GATE: PASS"
