name: IZFIN CI

on:
  # Her develop güncellemesi main'e alınmadan önce tam kalite kapısından geçer.
  # Scanner P2 refactor branch'i yalnızca bu geçici branch üzerinde aynı kapıyı kullanır.
  push:
    branches:
      - develop
      - refactor/scanner-p2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izfin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: ${{ github.ref != 'refs/heads/refactor/scanner-p2' || !contains(github.event.head_commit.message, '[scanner-p2-bot]') }}
    name: IZFIN Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Verify required runtime imports
        run: |
          python - <<'PY'
          import streamlit
          import pandas
          import numpy
          import yfinance
          import requests
          import firebase_admin
          import extra_streamlit_components
          import sentry_sdk
          print("IZFIN runtime imports: OK")
          PY

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          # CI smoke-test fixture only. Production secrets are never committed.
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Apply scanner P2 refactor
        if: ${{ github.ref == 'refs/heads/refactor/scanner-p2' }}
        run: python scripts/refactor_scanner_p2.py

      - name: Verify scanner refactor working tree
        if: ${{ github.ref == 'refs/heads/refactor/scanner-p2' }}
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "app2.py" ]; then
            echo "Unexpected working-tree changes detected."
            exit 1
          fi

      - name: Compile scanner refactor
        if: ${{ github.ref == 'refs/heads/refactor/scanner-p2' }}
        run: python -m py_compile app2.py izfin_core/scanner_engine.py

      - name: Run complete test suite
        env:
          # Empty values keep CI away from live Firebase, Finnhub and Sentry writes.
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q

      - name: Validate patch formatting
        if: ${{ github.ref == 'refs/heads/refactor/scanner-p2' }}
        run: git diff --check

      - name: Commit tested scanner refactor
        if: ${{ github.ref == 'refs/heads/refactor/scanner-p2' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app2.py
          if git diff --cached --quiet; then
            echo "No app2.py changes to commit."
            exit 0
          fi
          git commit -m "Wire scanner engine into smart scan [scanner-p2-bot]"
          git push origin HEAD:refactor/scanner-p2
