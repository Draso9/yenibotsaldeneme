name: IZFIN CI

on:
  # Her develop güncellemesi main'e alınmadan önce tam kalite kapısından geçer.
  push:
    branches:
      - develop
      - refactor/ui2-projection-view
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izfin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: ${{ !contains(github.event.head_commit.message, '[ui2-projection-bot]') }}
    name: IZFIN Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Verify required runtime imports
        run: |
          python - <<'PY'
          import streamlit
          import pandas
          import numpy
          import yfinance
          import requests
          import firebase_admin
          import extra_streamlit_components
          import sentry_sdk
          print("IZFIN runtime imports: OK")
          PY

      - name: Apply UI2 projection extraction
        if: ${{ github.ref_name == 'refactor/ui2-projection-view' }}
        run: python scripts/refactor_ui2_projection_view.py

      - name: Compile UI2 paths
        if: ${{ github.ref_name == 'refactor/ui2-projection-view' }}
        run: |
          python -m py_compile app2.py izfin_ui/projection_view.py tests/test_projection_view.py tests/test_core_architecture.py

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          # CI smoke-test fixture only. Production secrets are never committed.
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Run focused UI2 tests
        if: ${{ github.ref_name == 'refactor/ui2-projection-view' }}
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q tests/test_projection_view.py tests/test_core_architecture.py tests/test_apptest_smoke.py

      - name: Run complete test suite
        env:
          # Empty values keep CI away from live Firebase, Finnhub and Sentry writes.
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: "ci"
        run: python -m pytest -q

      - name: Verify generated UI2 diff
        if: ${{ github.ref_name == 'refactor/ui2-projection-view' }}
        shell: bash
        run: |
          git diff --stat
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              app2.py|tests/test_core_architecture.py) ;;
              *) echo "Unexpected generated path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          app_changes="$(git diff --numstat -- app2.py | awk '{print $1+$2}')"
          echo "app2 changed lines: ${app_changes:-0}"
          test "${app_changes:-99999}" -lt 250

      - name: Commit tested UI2 shell wiring
        if: ${{ github.ref_name == 'refactor/ui2-projection-view' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app2.py tests/test_core_architecture.py
          git commit -m "Wire projection view models [ui2-projection-bot]"
          git push origin HEAD:refactor/ui2-projection-view
