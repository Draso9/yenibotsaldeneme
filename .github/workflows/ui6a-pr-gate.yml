name: UI6A PR Gate

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: ui6a-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refactor/ui6a-scan-table-presenter'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout UI6A head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Run pure UI6A presenter tests before shell wiring
        run: python -m pytest -q tests/test_scan_table.py

      - name: Apply UI6A shell extraction when needed
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path("app2.py").read_text(encoding="utf-8")
          required = (
              "from izfin_ui.scan_table import (",
              "return tarama_tablosu_html(",
              "return tarama_genis_ozet_html(df)",
              "components.html(sortable_table_script(), height=0)",
          )
          legacy = (
              "def _iz_sort_num(",
              "def _iz_sort_risk(",
              "def _iz_sort_signal(",
              "def _iz_sort_flow(",
              'const tables=[...doc.querySelectorAll("table.iz-client-sortable")]',
          )
          if all(marker in source for marker in required) and all(marker not in source for marker in legacy):
              print("UI6A shell wiring already present; transform skipped.")
          else:
              subprocess.check_call([sys.executable, "scripts/refactor_ui6a_scan_table.py"])
          PY

      - name: Compile UI6A paths
        run: |
          python -m py_compile \
            app2.py \
            izfin_ui/scan_table.py \
            tests/test_scan_table.py \
            tests/test_core_architecture.py

      - name: Create CI-only Streamlit secrets file
        shell: bash
        run: |
          mkdir -p "${HOME}/.streamlit"
          cat > "${HOME}/.streamlit/secrets.toml" <<'EOF'
          FINNHUB_API_KEY = ""
          GOOGLE_OAUTH_CLIENT_ID = ""
          GOOGLE_OAUTH_CLIENT_SECRET = ""
          GOOGLE_OAUTH_REDIRECT_URI = ""
          ADMIN_EMAILS = ""
          SENTRY_DSN = ""
          IZFIN_ENVIRONMENT = "ci"
          IZFIN_DATA_CONTROLLER_NAME = ""
          IZFIN_CONTACT_EMAIL = ""
          IZFIN_DATA_CONTROLLER_ADDRESS = ""
          EOF

      - name: Run focused UI6A integration tests
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: ci
        run: |
          python -m pytest -q \
            tests/test_scan_table.py \
            tests/test_core_architecture.py \
            tests/test_static_integrity.py \
            tests/test_apptest_smoke.py

      - name: Run complete test suite
        env:
          FIREBASE_WEB_API_KEY: ""
          FIREBASE_PROJECT_ID: ""
          FINNHUB_API_KEY: ""
          GOOGLE_OAUTH_CLIENT_ID: ""
          GOOGLE_OAUTH_CLIENT_SECRET: ""
          GOOGLE_OAUTH_REDIRECT_URI: ""
          SENTRY_DSN: ""
          IZFIN_ENVIRONMENT: ci
        run: python -m pytest -q

      - name: Verify generated UI6A diff
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "UI6A wiring already committed; clean checkout verified."
            git diff --exit-code
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              app2.py|tests/test_core_architecture.py) ;;
              *) echo "Unexpected generated path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          app_changes="$(git diff --numstat -- app2.py | awk '{print $1+$2}')"
          echo "app2 changed lines: ${app_changes:-0}"
          test "${app_changes:-99999}" -lt 340

      - name: Commit tested UI6A shell wiring when generated
        shell: bash
        run: |
          if git diff --quiet -- app2.py tests/test_core_architecture.py; then
            echo "UI6A product wiring already committed; no bot commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app2.py tests/test_core_architecture.py
          git commit -m "Wire scan table presenter [ui6a-bot]"
          git push origin HEAD:refactor/ui6a-scan-table-presenter
